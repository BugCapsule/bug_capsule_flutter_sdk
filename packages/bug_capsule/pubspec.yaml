name: bug_capsule
description: Record and replay Flutter bugs with portable capsules, error monitoring, state and network integrations, and a CLI for verifying fixes.
version: 0.4.1-beta.11
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

executables:
  bugcapsule: bugcapsule

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  geolocator_platform_interface: ^4.4.1
  google_maps_flutter_platform_interface: ^2.17.0
  stripe_platform_interface: ^14.2.0
  args: ^2.6.0
  bloc: ^9.0.0
  clock: ^1.1.1
  dio: ^5.9.0
  get: ^4.6.0
  go_router: ">=14.0.0 <19.0.0"
  http: ^1.5.0
  mobx: ^2.3.0
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  riverpod: ^3.0.0
  shared_preferences: ^2.5.0
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.0

dev_dependencies:
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  provider: ^6.1.0
  test: ^1.25.0

# Deliberately synthetic redaction conformance fixture, never a credential.
false_secrets:
  - /tool/conformance_cases.dart
