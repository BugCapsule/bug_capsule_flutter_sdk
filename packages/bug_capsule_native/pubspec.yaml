name: bug_capsule_native
description: Native crash reporting for BugCapsule in Flutter apps. Android NDK and iOS signal and Mach crashes of the app, the Flutter engine and plugins, ANRs and app hangs, and the system's exit records, through the BugCapsule Android and iOS SDKs.
version: 0.1.0-dev.1
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule:
    path: ../bug_capsule

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.bugcapsule.bug_capsule_native
        pluginClass: BugCapsuleNativePlugin
        dartPluginClass: BugCapsuleNative
      ios:
        pluginClass: BugCapsuleNativePlugin
        dartPluginClass: BugCapsuleNative
