name: bug_capsule_native
description: Native crash reporting for Flutter apps using BugCapsule: Android NDK crashes and ANRs, iOS signals, Mach exceptions, hangs and exit diagnostics.
version: 0.1.0-beta.1
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule: ^0.4.1-beta.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.bugcapsule.bug_capsule_native
        pluginClass: BugCapsuleNativePlugin
        dartPluginClass: BugCapsuleNative
      ios:
        pluginClass: BugCapsuleNativePlugin
        dartPluginClass: BugCapsuleNative
