name: bug_capsule_geolocator
description: BugCapsule native SDK adapter for geolocator. Records permission, service and position results at the geolocator platform interface and replays them offline without touching location services.
version: 0.1.0-dev.1
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule:
    path: ../bug_capsule
  geolocator_platform_interface: ^4.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
