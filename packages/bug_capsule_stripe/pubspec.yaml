name: bug_capsule_stripe
description: BugCapsule native SDK adapter for flutter_stripe. Records payment sheet and payment outcomes at the Stripe platform interface; replay returns the recorded outcome without showing the native sheet or contacting Stripe.
version: 0.1.0-dev.1
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule:
    path: ../bug_capsule
  stripe_platform_interface: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
