name: bug_capsule_firebase
description: BugCapsule native SDK adapters for Firebase Auth and Cloud Firestore. Records what the app saw (identity state, snapshots, write outcomes) and replays it offline without contacting Firebase.
version: 0.1.0-dev.1
homepage: https://bugcapsule.com
documentation: https://docs.bugcapsule.com
repository: https://github.com/BugCapsule/bug_capsule_flutter_sdk
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule:
    path: ../bug_capsule
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0

dev_dependencies:
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_test:
    sdk: flutter
