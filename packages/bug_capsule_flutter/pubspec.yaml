name: bug_capsule_flutter
description: Flutter capture and replay SDK for BugCapsule — records the context around a failure into a portable .bugcapsule capsule and replays it locally.
version: 0.1.0
repository: https://github.com/draz26648/bug_capsule_flutter_sdk
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  bug_capsule_core: ^0.1.0
  clock: ^1.1.1
  path_provider: ^2.1.5

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
