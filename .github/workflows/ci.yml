name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly release-build smoke test
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          for p in packages/bug_capsule example/bug_capsule_demo; do
            (cd "$p" && flutter analyze --no-pub) || exit 1
          done
      # Core (capsule model, codec, validator + shared fixtures, redaction,
      # verdict rules), CLI (verdicts, exit codes and backend payloads of
      # run / verify / regress), runtime (isolation, remote config + kill
      # switch, outbox) and every integration.
      - name: bug_capsule tests
        working-directory: packages/bug_capsule
        run: flutter test --no-pub
      - name: Demo app widget smoke test
        working-directory: example/bug_capsule_demo
        run: flutter test --no-pub

  # Release builds of the demo app: capture compiles in, replay is disabled,
  # and the SDK does not break a release build. Signing and device runs are
  # manual (see docs/release-and-device-test-plan.md).
  release-build-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - working-directory: example/bug_capsule_demo
        run: flutter build apk --release --dart-define=BUGCAPSULE_GIT_SHA=${{ github.sha }}

  release-build-ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - working-directory: example/bug_capsule_demo
        run: flutter build ios --release --no-codesign --dart-define=BUGCAPSULE_GIT_SHA=${{ github.sha }}
