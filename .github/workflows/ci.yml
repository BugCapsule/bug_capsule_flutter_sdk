name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          for p in packages/* example/repro_demo; do
            (cd "$p" && flutter analyze --no-pub) || exit 1
          done
      - name: repro_core tests
        working-directory: packages/repro_core
        run: dart test
      - name: repro_dio tests
        working-directory: packages/repro_dio
        run: flutter test --no-pub
